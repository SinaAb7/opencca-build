version: "3.9"

services:
  opencca-build:
    build:
      context: ../
      dockerfile: docker/Dockerfile
      args:
        RELEASE_BUILD_DATE: ${RELEASE_BUILD_DATE}
        RELEASE_VCS_REF: ${RELEASE_VCS_REF}
        RELEASE_VERSION: ${RELEASE_VERSION}
    image: ghcr.io/opencca/opencca-build:latest
    hostname: opencca-build
    privileged: true
    network_mode: "host"
    extra_hosts:
      - "opencca-build:127.0.0.1"
    volumes:
      - ../../:/opencca # project root
      - ../../../.repo:/.repo # repo tool's object store: board/*'s .git symlinks (repo keeps them outside the checkout, e.g. board/tf-rmm/.git -> ../../.repo/projects/board/tf-rmm.git) resolve here now that /opencca is board/, not its parent
      - ../../:/board # same content as /opencca, second mountpoint: .repo's git-dirs point BACK at the worktree with a relative path that names the "board" directory literally (e.g. core.worktree = ../../../../../../board/tf-rmm/ext/mbedtls for the mbedtls submodule), so that name has to exist too, alongside /.repo
      - ~/.ccache:/root/.ccache  # Mount ccache directory
      - .bash_history:/root/.bash_history  # Persist Bash history
      - .fish_history:/root/.local/share/fish/fish_history  # Persist Fish history
      - .cache/:/root/.cache

    environment:
      - CCACHE_DIR=/root/.ccache

    working_dir: /opencca/
    stdin_open: true
    tty: true
